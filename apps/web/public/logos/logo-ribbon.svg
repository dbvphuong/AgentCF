<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Cyan to Magenta Core Gradient -->
    <linearGradient id="cf-core" x1="16" y1="96" x2="112" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="35%" stop-color="#0072FF" />
      <stop offset="68%" stop-color="#D9169A" />
      <stop offset="100%" stop-color="#8E2DE2" />
    </linearGradient>

    <!-- 3D Specular Highlight Gradient -->
    <linearGradient id="cf-spec" x1="30" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.4" />
    </linearGradient>

    <!-- Deep Shadow for Ribbon Overlap -->
    <linearGradient id="cf-shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A051B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0A051B" stop-opacity="0" />
    </linearGradient>

    <filter id="cf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8E2DE2" flood-opacity="0.3" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00D2FF" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Main Glow Filter Group -->
  <g filter="url(#cf-glow)">
    <!-- 1. The 'C' Loop: Starts from top-right of C, curves left, loops down and sweeps up into F -->
    <path
      d="M54 44 C52 35 44 30 35 30 C22 30 13 41 13 58 C13 75 24 88 41 88 C54 88 64 78 68 64 L68 40 C68 24 78 14 94 14 C104 14 111 19 113 26 C114 31 110 35 104 35 C95 35 88 40 88 50 L88 64"
      stroke="url(#cf-core)"
      stroke-width="14"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- 2. The 'F' Crossbar Wing -->
    <path
      d="M62 52 C72 50 86 48 106 48 C111 48 114 52 112 56 C110 60 105 62 98 62 C86 62 76 62 68 63"
      stroke="url(#cf-core)"
      stroke-width="11"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Inner Specular Ridge for 3D Tubular Look -->
    <path
      d="M52 42 C50 36 43 33 36 33 C25 33 17 43 17 58 C17 72 26 84 40 84 C51 84 60 76 64 64 L64 40 C64 26 74 18 92 18 C100 18 106 22 108 27"
      stroke="url(#cf-spec)"
      stroke-width="3.5"
      stroke-linecap="round"
      fill="none"
    />
  </g>
</svg>
