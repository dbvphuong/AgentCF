components:
  responses:
    Error401:
      description: Invalid or expired credential
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error403:
      description: Insufficient scope or resource permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error404:
      description: Not found within caller scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error409:
      description: idempotency_conflict, revision_conflict, stale_execution or run_terminal
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error422:
      description: Validation or schema error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error429:
      description: Rate or capacity limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error503:
      description: Temporary infrastructure failure; retry same key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Opaque per-principal credential, server validates scope and resource ownership. Operator, Runner
        and engine principals are separate. Execution token is additional, never replaces authentication.
  schemas:
    PairingCodeCreate:
      properties:
        workspace_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Workspace Id
        name:
          type: string
          maxLength: 128
          minLength: 1
          title: Name
        expires_in_seconds:
          type: integer
          maximum: 86400
          minimum: 30
          title: Expires In Seconds
          default: 300
        target_runner_id:
          anyOf:
            - type: string
            - type: "null"
          title: Target Runner Id
      type: object
      required:
        - workspace_id
        - name
      title: PairingCodeCreate
    PairingExchangeRequest:
      properties:
        pairing_code:
          type: string
          minLength: 1
          title: Pairing Code
        machine_fingerprint:
          anyOf:
            - type: string
            - type: "null"
          title: Machine Fingerprint
        client_version:
          anyOf:
            - type: string
            - type: "null"
          title: Client Version
        name:
          anyOf:
            - type: string
              maxLength: 128
              minLength: 1
            - type: "null"
          title: Name
        device_id:
          anyOf:
            - type: string
              pattern: ^device-[a-f0-9]{64}$
            - type: "null"
          title: Device Id
        device_key:
          anyOf:
            - type: string
              pattern: ^[a-f0-9]{64}$
            - type: "null"
          title: Device Key
          writeOnly: true
      type: object
      required:
        - pairing_code
      title: PairingExchangeRequest
    SessionCreateRequest:
      properties:
        client_version:
          type: string
          minLength: 1
          title: Client Version
        device_id:
          anyOf:
            - type: string
              pattern: ^device-[a-f0-9]{64}$
            - type: "null"
          title: Device Id
        device_key:
          anyOf:
            - type: string
              pattern: ^[a-f0-9]{64}$
            - type: "null"
          title: Device Key
          writeOnly: true
        machine_fingerprint:
          anyOf:
            - type: string
            - type: "null"
          title: Machine Fingerprint
        capabilities:
          items:
            type: string
          type: array
          title: Capabilities
        os_name:
          anyOf:
            - type: string
              maxLength: 256
            - type: "null"
          title: Os Name
      type: object
      required:
        - client_version
      title: SessionCreateRequest
    HeartbeatRequest:
      properties:
        session_id:
          type: string
          minLength: 1
          title: Session Id
        cpu_percent:
          anyOf:
            - type: number
              maximum: 100
              minimum: 0
            - type: "null"
          title: Cpu Percent
        ram_percent:
          anyOf:
            - type: number
              maximum: 100
              minimum: 0
            - type: "null"
          title: Ram Percent
        running_attempts:
          items:
            type: string
          type: array
          title: Running Attempts
        memory_total_bytes:
          anyOf:
            - type: integer
              exclusiveMinimum: 0
            - type: "null"
          title: Memory Total Bytes
        memory_used_bytes:
          anyOf:
            - type: integer
              minimum: 0
            - type: "null"
          title: Memory Used Bytes
      type: object
      required:
        - session_id
      title: HeartbeatRequest
    AiToolModelCreate:
      properties:
        name:
          type: string
          maxLength: 128
          minLength: 1
          title: Name
        model_identifier:
          type: string
          maxLength: 128
          minLength: 1
          title: Model Identifier
        status:
          type: string
          enum:
            - active
            - disabled
