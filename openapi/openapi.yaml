      type: object
      description: JSON Schema 2020-12 for an object. Publish validates dialect, object root, local refs only,
        complexity/size and unsupported constructs. No executable custom validators.
    Binding:
      oneOf:
        - type: object
          additionalProperties: false
          properties:
            target:
              type: string
              minLength: 1
              maxLength: 128
            source:
              type: string
              enum:
                - literal
            value: {}
          required:
            - target
            - source
            - value
        - type: object
          additionalProperties: false
          properties:
            target:
              type: string
              minLength: 1
              maxLength: 128
            source:
              type: string
              enum:
                - run_input
            pointer:
              type: string
          required:
            - target
            - source
            - pointer
        - type: object
          additionalProperties: false
          properties:
            target:
              type: string
              minLength: 1
              maxLength: 128
            source:
              type: string
              enum:
                - task_output
            task_id:
              type: string
              minLength: 1
              maxLength: 128
            pointer:
              type: string
          required:
            - target
            - source
            - task_id
            - pointer
      description: Unique top-level target for Task input. RFC6901 pointer; task source must be an ancestor. Missing
        pointer is an error. Run output is the complete terminal-task output object, not a custom mapping.
