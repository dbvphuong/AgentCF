openapi: 3.1.0
info:
  title: Agent CF foundation contract
  version: 0.1.0-foundation
  description: Versioned Process and Run/Client contract. Per-operation x-implementation-status records
    implemented-local editor APIs versus design contracts. Local UI operations require loopback access; remote
    operator authentication and deduplication of editor create requests remain pending. Skill 0?1?2 are
    fixtures.
security:
  - BearerAuth: []
paths:
  /v1/configuration:
    get:
      operationId: getConfiguration
      summary: getConfiguration
      description: Read validated runtime/model/Skill choices. Selection changes a draft and publish, never an
        existing run.
      security:
        - BearerAuth: []
      x-required-scope: operator
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Configuration"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"
        "429":
          $ref: "#/components/responses/Error429"
        "503":
          $ref: "#/components/responses/Error503"
      parameters:
        - name: runner_id
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
      x-implementation-status: design
  /v1/processes/{process_id}/versions/{version_id}:
    get:
      tags:
        - projects
      summary: Get Version
      operationId: getProcessVersion
      parameters:
        - name: process_id
          in: path
          required: true
          schema:
            type: string
            title: Process Id
        - name: version_id
          in: path
          required: true
          schema:
            type: string
            title: Version Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
      security: []
      x-implementation-status: implemented-local
      x-required-scope: local-operator
      description: Local loopback operator API; remote authentication is pending. Draft save/publication uses
        revision CAS. Create requests are not deduplicated by Idempotency-Key.
    put:
      tags:
        - projects
      summary: Save
      operationId: saveProcessDraft
      parameters:
        - name: process_id
          in: path
          required: true
          schema:
            type: string
            title: Process Id
        - name: version_id
          in: path
          required: true
          schema:
            type: string
            title: Version Id
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
          description: Accepted from Web; create-request deduplication remains pending.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftInput"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
      security: []
      x-implementation-status: implemented-local
      x-required-scope: local-operator
      description: Local loopback operator API; remote authentication is pending. Draft save/publication uses
        revision CAS. Create requests are not deduplicated by Idempotency-Key.
  /v1/processes/{process_id}/versions/{version_id}/publish:
    post:
      tags:
        - projects
      summary: Publish
      operationId: publishProcessDraft
      parameters:
        - name: process_id
          in: path
          required: true
          schema:
            type: string
            title: Process Id
        - name: version_id
          in: path
          required: true
          schema:
            type: string
            title: Version Id
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
          description: Accepted from Web; create-request deduplication remains pending.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionInput"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
      security: []
      x-implementation-status: implemented-local
      x-required-scope: local-operator
      description: Local loopback operator API; remote authentication is pending. Draft save/publication uses
        revision CAS. Create requests are not deduplicated by Idempotency-Key.
  /v1/processes/{process_id}/schedules:
    get:
      operationId: listProcessSchedules
      summary: listProcessSchedules
      description: List schedules for a process.
      security:
        - BearerAuth: []
      x-required-scope: operator
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Schedule"
                required:
                  - items
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"
        "429":
          $ref: "#/components/responses/Error429"
        "503":
          $ref: "#/components/responses/Error503"
      parameters:
        - name: process_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      x-implementation-status: design
    post:
      tags:
        - schedules
      summary: Create Process Schedule
      operationId: createProcessSchedule
      parameters:
        - name: process_id
          in: path
          required: true
          schema:
            type: string
            title: Process Id
        - name: project_id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            title: Project Id
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScheduleRequest"
      responses:
        "201":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Createprocessschedule
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
      security: []
      x-implementation-status: implemented-local
      x-required-scope: local-operator
      description: "Local loopback operator API; remote authentication is pending. Current Process configuration is
        saved with expected_token CAS (stale token: 409). Save validates current Skill/model/PC/tool
        configuration. Process Run creation atomically freezes the current configuration and is deduplicated
        by Idempotency-Key before creating any snapshot. Web schedules use follow_current_configuration=true.
        Robot ready_to_use=true saves an immutable usable version atomically; legacy lifecycle APIs remain
        compatible. No Markdown/ref file upload is required."
